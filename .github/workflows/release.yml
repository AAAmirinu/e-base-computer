name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/verify_release.py
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
      - name: Run release smoke
        run: python scripts/release_smoke.py
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build --outdir release-dist
      - name: Build deterministic source bundle
        run: python scripts/make_release_bundle.py --output "release-dist/e-base-computer-${{ steps.metadata.outputs.version }}-source.zip"
      - name: Check package metadata
        run: >-
          python -m twine check
          "release-dist/e_base_computer-${{ steps.metadata.outputs.version }}-py3-none-any.whl"
          "release-dist/e_base_computer-${{ steps.metadata.outputs.version }}.tar.gz"
      - name: Verify artifacts and write checksums
        run: python scripts/verify_release.py --dist release-dist --write-checksums release-dist/SHA256SUMS.txt
      - name: Smoke release container
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg EBASE_VERSION="$VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            -t "e-base-computer:$VERSION" .
          docker run -d --rm -p 8765:8765 --name ebase-release "e-base-computer:$VERSION"
          trap 'docker stop ebase-release >/dev/null 2>&1 || true' EXIT
          sleep 3
          curl --fail http://127.0.0.1:8765/api/samples
          curl --fail 'http://127.0.0.1:8765/api/challenge?suite=official'
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-base-computer-dist
          if-no-files-found: error
          path: |
            release-dist/e_base_computer-${{ steps.metadata.outputs.version }}-py3-none-any.whl
            release-dist/e_base_computer-${{ steps.metadata.outputs.version }}.tar.gz
            release-dist/e-base-computer-${{ steps.metadata.outputs.version }}-source.zip
            release-dist/SHA256SUMS.txt
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-dist/e_base_computer-${{ steps.metadata.outputs.version }}-py3-none-any.whl" \
            "release-dist/e_base_computer-${{ steps.metadata.outputs.version }}.tar.gz" \
            "release-dist/e-base-computer-${{ steps.metadata.outputs.version }}-source.zip" \
            release-dist/SHA256SUMS.txt \
            --title "E-base Computer $GITHUB_REF_NAME" \
            --notes-file docs/release_notes_v0_2.md \
            --verify-tag
